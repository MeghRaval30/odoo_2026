<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request covering every theme's display face. Each theme's stack ends
      in a real system fallback of the same class (serif / grotesk / mono /
      humanist), so an offline demo machine still gets six distinguishable
      design languages rather than six copies of Arial.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the page never flashes the default theme
      // on the way to the chosen one. Mirrors lib/theme.js; kept inline because
      // a module import is already too late.
      (function () {
        try {
          var t = localStorage.getItem("pp360_theme");
          var known = ["ledger", "console", "atrium", "blueprint", "marigold", "graphite"];
          document.documentElement.setAttribute(
            "data-theme", known.indexOf(t) >= 0 ? t : "ledger");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "ledger");
        }
      })();
    </script>
    <title>PeoplePay360</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
